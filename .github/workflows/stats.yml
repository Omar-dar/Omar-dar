name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"  # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download stats SVGs (fallback + validation)
        run: |
          set -e
          mkdir -p assets

          download() {
            URL="$1"
            OUT="$2"
            curl -L --fail -A "Mozilla/5.0" -H "Accept: image/svg+xml" "$URL" -o "$OUT"
            if ! grep -q "<svg" "$OUT"; then
              echo "INVALID SVG at $OUT"
              head -n 20 "$OUT"
              return 1
            fi
          }

          # Try primary, if fails use mirror
          download "https://github-readme-stats.vercel.app/api?username=Omar-dar&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github" "assets/github-stats.svg" \
          || download "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api?username=Omar-dar&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github" "assets/github-stats.svg"

          download "https://github-readme-stats.vercel.app/api/top-langs/?username=Omar-dar&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" "assets/top-langs.svg" \
          || download "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api/top-langs/?username=Omar-dar&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" "assets/top-langs.svg"

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/top-langs.svg
          git commit -m "Update stats cards" || echo "No changes to commit"
          git push
