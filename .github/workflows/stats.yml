name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"  # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download stats SVGs
        run: |
          mkdir -p assets

          # Main stats card
          curl -L -A "Mozilla/5.0" \
            "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api?username=Omar-dar&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github" \
            -o assets/github-stats.svg

          # Top languages card
          curl -L -A "Mozilla/5.0" \
            "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api/top-langs/?username=Omar-dar&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" \
            -o assets/top-langs.svg

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/top-langs.svg
          git commit -m "Update stats cards" || echo "No changes to commit"
          git push
