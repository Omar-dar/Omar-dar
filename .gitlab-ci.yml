stages:
  - generate
  - commit

generate_pacman:
  stage: generate
  image: node:20
  script:
    - npm install -g pacman-contribution-graph
    - mkdir -p output
    - pacman-contribution-graph --platform gitlab --username "$CI_PROJECT_NAMESPACE" --output output/pacman-contribution-graph-light.svg
    - pacman-contribution-graph --platform gitlab --username "$CI_PROJECT_NAMESPACE" --gameTheme gitlab-dark --output output/pacman-contribution-graph-dark.svg
  artifacts:
    paths:
      - output/
    expire_in: 1 hour

commit_pacman:
  stage: commit
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git config --global user.email "pacman-bot@example.com"
    - git config --global user.name "Pacman Bot"
    - git remote set-url origin https://gitlab-ci-token:${CI_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git
    - git add output/pacman-contribution-graph-light.svg output/pacman-contribution-graph-dark.svg
    - git commit -m "Update contribution graph [ci skip]" || echo "No changes to commit"
    - git push origin HEAD:main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
